[package]
name = "jammygit"
version = "0.1.0"
edition = "2024"
description = "A small, careful Git terminal interface"
license = "MIT"
repository = "https://github.com/initiumailab/jammygit"

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
portable-pty = "0.9"
vt100 = "0.18.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
