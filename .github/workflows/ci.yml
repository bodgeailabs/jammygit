name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check release tooling and installer
        run: |
          for script in install.sh scripts/publish-release.sh scripts/check-static.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s tests -p 'test_release*.py' -v
      - name: Lint Bash scripts
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends shellcheck
          fi
          shellcheck install.sh scripts/publish-release.sh scripts/check-static.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 scripts/smoke_test.py
      - name: Exercise Linux static release before tagging
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked --release --target x86_64-unknown-linux-musl
          bash scripts/check-static.sh target/x86_64-unknown-linux-musl/release/jammygit
          target/x86_64-unknown-linux-musl/release/jammygit --version
          python3 scripts/smoke_test.py target/x86_64-unknown-linux-musl/release/jammygit
